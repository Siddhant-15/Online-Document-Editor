services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docs-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docs-frontend
    ports:
      - "3001:80"
    depends_on:
      - backend
    restart: unless-stopped
